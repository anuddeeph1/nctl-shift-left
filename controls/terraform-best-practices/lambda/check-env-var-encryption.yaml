apiVersion: json.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: check-env-var-encryption
  annotations:
    policies.kyverno.io/title: Check Environment Variable Encryption
    policies.kyverno.io/category: Lambda Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Ensure Lambda function environment variables are encrypted using KMS to protect sensitive data.
spec:
  rules:
    - name: check-env-var-encryption
      match:
        any:
        - (planned_values.root_module.resources[?type=='aws_lambda_function'] | length(@) > `0`): true
      assert:
        all:
        - message: Lambda function must have environment variables configured and encrypted with KMS
          check:
            (planned_values.root_module.resources[?type=='aws_lambda_function' && values.kms_key_arn != ''] | length(@) > `0`): true